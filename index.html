Here's your complete romantic website — a digital love letter with every feature you asked for. All editable content is organized at the top of the JavaScript section for easy customization.

```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Love Letter to You</title>

  <!-- ============================================================
       FONTS
       ============================================================ -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Dancing+Script:wght@400;600;700&family=Lato:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    / ============================================================
       CSS CUSTOM PROPERTIES — THEME
       ============================================================ /
    :root {
      --clr-bg:        #0d0608;
      --clr-surface:   #1a0d10;
      --clr-surface2:  #231318;
      --clr-accent:    #c9556a;
      --clr-accent2:   #e8a0aa;
      --clr-gold:      #d4a853;
      --clr-text:      #f0e6e8;
      --clr-muted:     #9e7d84;
      --ff-serif:      'Cormorant Garamond', Georgia, serif;
      --ff-script:     'Dancing Script', cursive;
      --ff-sans:       'Lato', sans-serif;
      --transition:    0.4s ease;
      --radius:        16px;
    }

    / ============================================================
       RESET & BASE
       ============================================================ /
    , ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      background: var(--clr-bg);
      color: var(--clr-text);
      font-family: var(--ff-sans);
      font-weight: 300;
      overflow-x: hidden;
      line-height: 1.7;
    }

    img { display: block; max-width: 100%; height: auto; }

    a { color: var(--clr-accent2); text-decoration: none; }

    section { padding: 100px 24px; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      font-family: var(--ff-sans);
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--clr-accent);
      margin-bottom: 12px;
    }

    .section-title {
      font-family: var(--ff-serif);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      line-height: 1.2;
      margin-bottom: 48px;
      color: var(--clr-text);
    }

    / ============================================================
       LOADING SCREEN
       ============================================================ /
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--clr-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-heart {
      font-size: 3rem;
      animation: heartbeat 1.2s ease-in-out infinite;
      margin-bottom: 24px;
      color: var(--clr-accent);
    }

    / id="loading-message" text set from JS config below /
    .loading-text {
      font-family: var(--ff-script);
      font-size: 1.6rem;
      color: var(--clr-accent2);
      opacity: 0.9;
    }

    .loading-bar {
      width: 200px;
      height: 2px;
      background: var(--clr-surface2);
      border-radius: 2px;
      margin-top: 24px;
      overflow: hidden;
    }

    .loading-bar-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--clr-accent), var(--clr-gold));
      border-radius: 2px;
      animation: loadFill 2s ease forwards;
    }

    @keyframes loadFill { to { width: 100%; } }

    / ============================================================
       FLOATING HEARTS
       ============================================================ /
    #hearts-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-heart {
      position: absolute;
      bottom: -60px;
      color: var(--clr-accent);
      font-size: 1rem;
      opacity: 0;
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(0deg) scale(1);   opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.3; }
      100% { transform: translateY(-110vh) rotate(30deg) scale(0.5); opacity: 0; }
    }

    / ============================================================
       MUSIC PLAYER
       ============================================================ /
    #music-btn {
      position: fixed;
      bottom: 28px;
      right: 28px;
      z-index: 1000;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid var(--clr-accent);
      background: rgba(13, 6, 8, 0.85);
      backdrop-filter: blur(12px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: var(--clr-accent2);
      transition: var(--transition);
      box-shadow: 0 0 20px rgba(201, 85, 106, 0.25);
    }

    #music-btn:hover {
      background: rgba(201, 85, 106, 0.2);
      box-shadow: 0 0 30px rgba(201, 85, 106, 0.45);
      transform: scale(1.08);
    }

    / ============================================================
       HERO SECTION
       ============================================================ /
    #hero {
      /
      ================================================================
      BACKGROUND IMAGE
      To replace: put your image in the "images/" folder and update
      the filename below in the #hero background-image property.
      ================================================================
      /
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 0 24px;
      background-image: url('images/hero-bg.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(13, 6, 8, 0.55) 0%,
        rgba(13, 6, 8, 0.35) 50%,
        rgba(13, 6, 8, 0.85) 100%
      );
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
    }

    .hero-eyebrow {
      font-family: var(--ff-sans);
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--clr-gold);
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeInUp 1s 0.3s forwards;
    }

    .hero-title {
      font-family: var(--ff-script);
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 700;
      line-height: 1.1;
      color: #fff;
      text-shadow: 0 2px 40px rgba(201, 85, 106, 0.4);
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeInUp 1s 0.6s forwards;
    }

    .hero-subtitle {
      font-family: var(--ff-serif);
      font-size: clamp(1.1rem, 3vw, 1.6rem);
      font-weight: 300;
      font-style: italic;
      color: var(--clr-accent2);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeInUp 1s 0.9s forwards;
    }

    .hero-message {
      font-family: var(--ff-serif);
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      color: rgba(240, 230, 232, 0.8);
      max-width: 560px;
      margin: 0 auto 40px;
      opacity: 0;
      animation: fadeInUp 1s 1.2s forwards;
    }

    .btn-scroll {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      border: 1.5px solid var(--clr-accent);
      border-radius: 50px;
      color: var(--clr-text);
      font-family: var(--ff-sans);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      background: rgba(201, 85, 106, 0.08);
      backdrop-filter: blur(8px);
      transition: var(--transition);
      opacity: 0;
      animation: fadeInUp 1s 1.5s forwards;
    }

    .btn-scroll:hover {
      background: rgba(201, 85, 106, 0.22);
      box-shadow: 0 0 28px rgba(201, 85, 106, 0.35);
      transform: translateY(-2px);
    }

    .btn-scroll svg {
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(5px); }
    }

    / ============================================================
       LOVE LETTER SECTION
       ============================================================ /
    #love-letter {
      background: linear-gradient(180deg, var(--clr-bg), var(--clr-surface));
      position: relative;
      z-index: 1;
    }

    .letter-card {
      background: linear-gradient(135deg, #1e0d12, #260e15);
      border: 1px solid rgba(201, 85, 106, 0.2);
      border-radius: var(--radius);
      padding: clamp(36px, 6vw, 80px);
      position: relative;
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(201, 85, 106, 0.05);
    }

    .letter-card::before {
      content: '\201C';
      font-family: var(--ff-serif);
      font-size: 10rem;
      line-height: 1;
      color: rgba(201, 85, 106, 0.08);
      position: absolute;
      top: 16px;
      left: 32px;
    }

    .letter-salutation {
      font-family: var(--ff-script);
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--clr-accent);
      margin-bottom: 28px;
    }

    .letter-body {
      font-family: var(--ff-script);
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      color: var(--clr-text);
      line-height: 2;
      white-space: pre-line;
    }

    .letter-body p { margin-bottom: 22px; }

    .letter-closing {
      font-family: var(--ff-script);
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: var(--clr-accent2);
      margin-top: 36px;
    }

    / ============================================================
       MEMORY GALLERY
       ============================================================ /
    #gallery {
      background: var(--clr-surface);
      position: relative;
      z-index: 1;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 1;
      position: relative;
      background: var(--clr-surface2);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease, filter 0.5s ease;
      filter: brightness(0.88) saturate(0.9);
    }

    .gallery-item:hover img {
      transform: scale(1.06);
      filter: brightness(1) saturate(1.1);
    }

    .gallery-item::after {
      content: attr(data-caption);
      position: absolute;
      inset: auto 0 0 0;
      padding: 16px 14px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      font-family: var(--ff-serif);
      font-style: italic;
      font-size: 0.9rem;
      color: var(--clr-accent2);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .gallery-item:hover::after { opacity: 1; }

    / Lightbox /
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 9000;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(6px);
    }

    #lightbox.active { display: flex; }

    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      object-fit: contain;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    }

    #lightbox-close {
      position: absolute;
      top: 24px;
      right: 28px;
      font-size: 2rem;
      color: var(--clr-text);
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
      background: none;
      border: none;
      line-height: 1;
    }

    #lightbox-close:hover { opacity: 1; }

    #lightbox-caption {
      position: absolute;
      bottom: 28px;
      font-family: var(--ff-serif);
      font-style: italic;
      color: var(--clr-accent2);
      font-size: 1rem;
      text-align: center;
      width: 100%;
    }

    / ============================================================
       REASONS I LOVE YOU
       ============================================================ /
    #reasons {
      background: linear-gradient(180deg, var(--clr-surface), var(--clr-bg));
      position: relative;
      z-index: 1;
    }

    .reasons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 20px;
    }

    .reason-card {
      background: linear-gradient(135deg, var(--clr-surface2), #1e0d12);
      border: 1px solid rgba(201, 85, 106, 0.15);
      border-radius: var(--radius);
      padding: 28px 24px;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .reason-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(201, 85, 106, 0.12);
      border-color: rgba(201, 85, 106, 0.4);
    }

    .reason-number {
      font-family: var(--ff-script);
      font-size: 2.5rem;
      color: rgba(201, 85, 106, 0.25);
      line-height: 1;
      margin-bottom: 8px;
    }

    .reason-text {
      font-family: var(--ff-serif);
      font-size: 1.05rem;
      color: var(--clr-text);
      line-height: 1.65;
    }

    / ============================================================
       TIMELINE
       ============================================================ /
    #timeline {
      background: var(--clr-bg);
      position: relative;
      z-index: 1;
    }

    .timeline-track {
      position: relative;
      padding-left: 40px;
    }

    .timeline-track::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, transparent, var(--clr-accent) 8%, var(--clr-accent) 92%, transparent);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 60px;
    }

    .timeline-dot {
      position: absolute;
      left: -40px;
      top: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--clr-accent);
      border: 3px solid var(--clr-bg);
      box-shadow: 0 0 12px rgba(201, 85, 106, 0.5);
    }

    .timeline-date {
      font-family: var(--ff-sans);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--clr-gold);
      margin-bottom: 6px;
    }

    .timeline-title {
      font-family: var(--ff-serif);
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      font-weight: 400;
      margin-bottom: 10px;
      color: var(--clr-text);
    }

    .timeline-desc {
      font-family: var(--ff-serif);
      font-size: 1rem;
      color: var(--clr-muted);
      line-height: 1.7;
      max-width: 620px;
    }

    .timeline-img {
      margin-top: 16px;
      border-radius: 10px;
      max-width: 480px;
      width: 100%;
      object-fit: cover;
      max-height: 300px;
      filter: brightness(0.9) saturate(0.85);
    }

    / ============================================================
       OPEN WHEN LETTERS
       ============================================================ /
    #open-when {
      background: linear-gradient(180deg, var(--clr-bg), var(--clr-surface));
      position: relative;
      z-index: 1;
    }

    .envelopes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    .envelope-wrapper {
      position: relative;
    }

    .envelope {
      background: linear-gradient(145deg, #2a1018, #1e0d12);
      border: 1px solid rgba(201, 85, 106, 0.25);
      border-radius: var(--radius);
      padding: 32px 28px 28px;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .envelope:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(201, 85, 106, 0.15);
    }

    .envelope::before {
      content: '✉';
      position: absolute;
      top: 16px;
      right: 20px;
      font-size: 1.4rem;
      color: rgba(201, 85, 106, 0.4);
    }

    .envelope-label {
      font-family: var(--ff-script);
      font-size: 1.05rem;
      color: var(--clr-gold);
      margin-bottom: 6px;
    }

    .envelope-title {
      font-family: var(--ff-serif);
      font-size: 1.2rem;
      color: var(--clr-text);
    }

    .envelope-hint {
      font-size: 0.75rem;
      color: var(--clr-muted);
      margin-top: 10px;
      font-family: var(--ff-sans);
      letter-spacing: 0.08em;
    }

    / Message panel /
    .envelope-message {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0;
      background: linear-gradient(145deg, #2e0f1b, #1a080e);
      border: 1px solid rgba(201, 85, 106, 0.4);
      border-radius: var(--radius);
      padding: 28px;
      z-index: 10;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      animation: letterOpen 0.35s ease;
    }

    @keyframes letterOpen {
      from { opacity: 0; transform: translateY(-10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .envelope-message.open { display: block; }

    .msg-close {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      color: var(--clr-muted);
      font-size: 1.2rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .msg-close:hover { color: var(--clr-accent); }

    .msg-heading {
      font-family: var(--ff-script);
      font-size: 1.3rem;
      color: var(--clr-accent);
      margin-bottom: 14px;
    }

    .msg-body {
      font-family: var(--ff-script);
      font-size: 1.05rem;
      color: var(--clr-text);
      line-height: 1.85;
      white-space: pre-line;
    }

    / ============================================================
       FUTURE DREAMS
       ============================================================ /
    #dreams {
      background: var(--clr-surface);
      position: relative;
      z-index: 1;
    }

    .dreams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 24px;
    }

    .dream-card {
      background: linear-gradient(145deg, #1a0d10, var(--clr-surface2));
      border: 1px solid rgba(212, 168, 83, 0.15);
      border-radius: var(--radius);
      padding: 32px 26px;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .dream-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 18px 40px rgba(212, 168, 83, 0.1);
      border-color: rgba(212, 168, 83, 0.35);
    }

    .dream-icon {
      font-size: 2rem;
      margin-bottom: 14px;
    }

    .dream-title {
      font-family: var(--ff-serif);
      font-size: 1.25rem;
      color: var(--clr-gold);
      margin-bottom: 10px;
    }

    .dream-desc {
      font-family: var(--ff-serif);
      font-size: 0.97rem;
      color: var(--clr-muted);
      line-height: 1.7;
    }

    / ============================================================
       FINAL MESSAGE
       ============================================================ /
    #final {
      background: linear-gradient(180deg, var(--clr-surface), var(--clr-bg));
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .final-heart {
      font-size: 3rem;
      color: var(--clr-accent);
      margin-bottom: 24px;
      display: block;
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    .final-title {
      font-family: var(--ff-script);
      font-size: clamp(2.5rem, 8vw, 5rem);
      color: var(--clr-text);
      margin-bottom: 32px;
      line-height: 1.2;
    }

    .final-message {
      font-family: var(--ff-serif);
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-style: italic;
      color: var(--clr-accent2);
      max-width: 680px;
      margin: 0 auto 40px;
      line-height: 1.85;
      white-space: pre-line;
    }

    .final-signature {
      font-family: var(--ff-script);
      font-size: clamp(1.4rem, 4vw, 2rem);
      color: var(--clr-gold);
    }

    / ============================================================
       SHARED ANIMATIONS
       ============================================================ /
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.18); }
      28%       { transform: scale(1); }
      42%       { transform: scale(1.12); }
      70%       { transform: scale(1); }
    }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    / stagger children /
    .stagger >  { transition-delay: calc(var(--i, 0)  0.07s); }

    / ============================================================
       DIVIDER
       ============================================================ /
    .divider {
      text-align: center;
      color: var(--clr-accent);
      opacity: 0.35;
      font-size: 1rem;
      letter-spacing: 0.4em;
      margin: 0 auto;
      display: block;
    }

    / ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 640px) {
      section { padding: 72px 18px; }
      .timeline-track { padding-left: 28px; }
      .timeline-dot   { left: -28px; }
      .letter-card { padding: 28px 22px; }
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    }
  </style>
</head>

<body>

  <!-- ============================================================
       LOADING SCREEN
       ============================================================ -->
  <div id="loading-screen">
    <div class="loading-heart">♥</div>
    <p class="loading-text" id="loading-message"><!-- Set in CONFIG below --></p>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
