<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>For You — A Love Letter</title>
<link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)">
<link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
<link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Pinyon+Script&family=Parisienne&family=Inter:wght@300;400&display=swap)" rel="stylesheet">
<style>
:root{
  --bg:#0a0408;--bg2:#140810;--rose:#d4869a;--rose-deep:#a64b66;
  --gold:#c9a87c;--ivory:#f5e9e4;--muted:#8a6770;
  --serif:'Cormorant Garamond',serif;--script:'Pinyon Script',cursive;
  --script2:'Parisienne',cursive;--sans:'Inter',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ivory);font-family:var(--sans);font-weight:300;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

#loader{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease}
#loader.gone{opacity:0;visibility:hidden}
#loader .heart{font-size:2.5rem;color:var(--rose-deep);animation:beat 1.4s ease-in-out infinite;margin-bottom:28px}
#loader .msg{font-family:var(--script);font-size:1.8rem;color:var(--rose)}
#loader .bar{width:160px;height:1px;margin-top:32px;background:rgba(212,134,154,.15);overflow:hidden}
#loader .bar::after{content:'';display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));animation:fill 1.8s ease forwards}
@keyframes fill{to{width:100%}}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.15)}40%{transform:scale(1)}60%{transform:scale(1.1)}}

#hearts{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.h-float{position:absolute;bottom:-40px;color:var(--rose-deep);opacity:0;animation:rise linear infinite;filter:drop-shadow(0 0 6px rgba(212,134,154,.4))}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.5}100%{transform:translateY(-105vh) rotate(20deg);opacity:0}}

#music{position:fixed;bottom:24px;right:24px;z-index:1000;width:48px;height:48px;border-radius:50%;background:rgba(20,8,16,.8);border:1px solid rgba(212,134,154,.4);backdrop-filter:blur(10px);color:var(--rose);display:flex;align-items:center;justify-content:center;font-size:1.1rem;transition:all .4s ease}
#music:hover{background:rgba(166,75,102,.3);box-shadow:0 0 25px rgba(212,134,154,.4);transform:scale(1.08)}

section{position:relative;z-index:3;padding:120px 24px}
.wrap{max-width:1080px;margin:0 auto}
.eyebrow{font-family:var(--sans);font-size:.7rem;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.eyebrow::before{content:'';display:inline-block;width:32px;height:1px;background:var(--gold);vertical-align:middle;margin-right:14px;opacity:.7}
.h-section{font-family:var(--serif);font-weight:300;font-size:clamp(2.2rem,5.5vw,4rem);line-height:1.1;margin-bottom:56px}
.h-section em{font-family:var(--script2);font-style:normal;color:var(--rose);font-weight:400}
.fade-in{opacity:0;transform:translateY(40px);transition:opacity 1s ease,transform 1s ease}
.fade-in.in{opacity:1;transform:none}

#hero{min-height:100vh;padding:0 24px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,rgba(10,4,8,.6),rgba(10,4,8,.4) 50%,rgba(10,4,8,.95)),url('images/hero-bg.jpg') center/cover no-repeat,radial-gradient(ellipse at center,#2a1320,#0a0408)}
.hero-inner{max-width:760px;position:relative;z-index:3}
.hero-tag{font-family:var(--sans);font-size:.7rem;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);margin-bottom:32px;opacity:0;animation:up 1.2s .3s forwards}
.hero-title{font-family:var(--script);font-size:clamp(3.5rem,11vw,7.5rem);line-height:1;color:#fff;text-shadow:0 4px 60px rgba(166,75,102,.5);margin-bottom:28px;opacity:0;animation:up 1.4s .6s forwards}
.hero-sub{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,2.6vw,1.6rem);color:var(--rose);margin-bottom:24px;opacity:0;animation:up 1.2s .9s forwards}
.hero-msg{font-family:var(--serif);font-size:clamp(1rem,1.8vw,1.15rem);color:rgba(245,233,228,.75);max-width:540px;margin:0 auto 48px;opacity:0;animation:up 1.2s 1.2s forwards}
.hero-btn{display:inline-flex;align-items:center;gap:12px;padding:14px 38px;border:1px solid rgba(212,134,154,.5);border-radius:100px;color:var(--ivory);font-size:.75rem;letter-spacing:.3em;text-transform:uppercase;background:rgba(166,75,102,.08);backdrop-filter:blur(8px);transition:all .4s ease;opacity:0;animation:up 1.2s 1.5s forwards}
.hero-btn:hover{background:rgba(166,75,102,.25);border-color:var(--rose);box-shadow:0 0 30px rgba(212,134,154,.3)}
@keyframes up{to{opacity:1;transform:none}}

#letter{background:linear-gradient(180deg,var(--bg),var(--bg2))}
.letter-card{background:linear-gradient(135deg,rgba(26,12,20,.95),rgba(20,8,16,.95));border:1px solid rgba(212,134,154,.2);border-radius:4px;padding:clamp(40px,7vw,90px);position:relative;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.letter-card::before,.letter-card::after{content:'';position:absolute;width:40px;height:40px;border:1px solid rgba(201,168,124,.4)}
.letter-card::before{top:20px;left:20px;border-right:none;border-bottom:none}
.letter-card::after{bottom:20px;right:20px;border-left:none;border-top:none}
.letter-greet{font-family:var(--script2);font-size:clamp(1.8rem,4.5vw,2.6rem);color:var(--rose);margin-bottom:36px}
.letter-body{font-family:var(--script2);font-size:clamp(1.1rem,2vw,1.35rem);color:var(--ivory);line-height:2.1}
.letter-body p{margin-bottom:24px}
.letter-sign{margin-top:48px;font-family:var(--script);font-size:clamp(1.6rem,4vw,2.2rem);color:var(--gold)}

#gallery{background:var(--bg2)}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.g-item{position:relative;overflow:hidden;border-radius:2px;aspect-ratio:1;cursor:pointer;background:#1a0c14}
.g-item img{width:100%;height:100%;object-fit:cover;filter:brightness(.85) saturate(.9);transition:transform .8s ease,filter .6s ease}
.g-item:hover img{transform:scale(1.08);filter:brightness(1) saturate(1)}
.g-item::after{content:attr(data-cap);position:absolute;left:0;right:0;bottom:0;padding:24px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));font-family:var(--serif);font-style:italic;font-size:.9rem;color:var(--rose);opacity:0;transform:translateY(10px);transition:all .4s ease}
.g-item:hover::after{opacity:1;transform:none}
#lb{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);padding:40px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:85vh;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.8)}
#lb-close{position:absolute;top:24px;right:28px;font-size:2rem;color:var(--ivory);opacity:.6;transition:all .2s}
#lb-close:hover{opacity:1;transform:rotate(90deg)}
#lb-cap{position:absolute;bottom:30px;left:0;right:0;text-align:center;font-family:var(--serif);font-style:italic;color:var(--rose)}

#reasons{background:linear-gradient(180deg,var(--bg2),var(--bg))}
.reasons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.r-card{position:relative;background:linear-gradient(145deg,rgba(26,12,20,.7),rgba(20,8,16,.7));border:1px solid rgba(212,134,154,.12);border-radius:4px;padding:36px 26px 28px;transition:all .5s cubic-bezier(.2,.8,.2,1)}
.r-card:hover{transform:translateY(-8px);border-color:rgba(212,134,154,.35);box-shadow:0 20px 50px rgba(166,75,102,.15)}
.r-num{font-family:var(--script);font-size:2.4rem;line-height:1;color:var(--rose-deep);opacity:.5;margin-bottom:12px}
.r-text{font-family:var(--serif);font-size:1.05rem;line-height:1.6;color:var(--ivory)}

#timeline{background:var(--bg)}
.tl{position:relative;padding-left:50px;max-width:760px;margin:0 auto}
.tl::before{content:'';position:absolute;left:8px;top:8px;bottom:8px;width:1px;background:linear-gradient(to bottom,transparent,var(--rose-deep) 8%,var(--rose-deep) 92%,transparent)}
.tl-item{position:relative;margin-bottom:70px}
.tl-item:last-child{margin-bottom:0}
.tl-dot{position:absolute;left:-50px;top:6px;width:17px;height:17px;border-radius:50%;background:var(--bg);border:2px solid var(--rose);box-shadow:0 0 0 4px var(--bg),0 0 18px rgba(212,134,154,.5)}
.tl-date{font-family:var(--sans);font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.tl-title{font-family:var(--serif);font-weight:400;font-size:clamp(1.3rem,3vw,1.7rem);color:var(--ivory);margin-bottom:12px}
.tl-desc{font-family:var(--serif);font-size:1.05rem;color:var(--muted);line-height:1.7}
.tl-img{margin-top:18px;border-radius:2px;max-width:420px;width:100%;max-height:280px;object-fit:cover;filter:brightness(.88) saturate(.85)}

#open-when{background:linear-gradient(180deg,var(--bg),var(--bg2))}
.env-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px}
.env{position:relative;background:linear-gradient(145deg,#2a1320,#1a0c14);border:1px solid rgba(201,168,124,.2);border-radius:3px;padding:36px 28px 28px;cursor:pointer;transition:all .5s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.env:hover{transform:translateY(-6px);box-shadow:0 20px 50px rgba(0,0,0,.5);border-color:var(--gold)}
.env-icon{position:absolute;top:18px;right:20px;font-size:1.3rem;color:var(--rose);opacity:.6}
.env-when{font-family:var(--script2);font-size:1.15rem;color:var(--gold);margin-bottom:6px}
.env-label{font-family:var(--serif);font-size:1.2rem;color:var(--ivory);margin-bottom:14px}
.env-open-btn{display:inline-block;font-family:var(--sans);font-size:.65rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rose);border-bottom:1px solid var(--rose-deep);padding-bottom:2px}
#env-modal{position:fixed;inset:0;z-index:9500;background:rgba(5,2,4,.92);display:none;align-items:center;justify-content:center;backdrop-filter:blur(10px);padding:24px}
#env-modal.on{display:flex}
.env-paper{max-width:600px;width:100%;background:linear-gradient(135deg,#2a1320,#1a0c14);border:1px solid rgba(201,168,124,.4);padding:56px 44px;position:relative;box-shadow:0 40px 100px rgba(0,0,0,.8);animation:unfold .6s cubic-bezier(.2,.8,.2,1)}
@keyframes unfold{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.env-paper-close{position:absolute;top:18px;right:22px;font-size:1.6rem;color:var(--muted);transition:all .2s}
.env-paper-close:hover{color:var(--rose);transform:rotate(90deg)}
.env-paper-when{font-family:var(--script2);font-size:1.4rem;color:var(--gold);margin-bottom:24px}
.env-paper-body{font-family:var(--script2);font-size:1.2rem;line-height:2;color:var(--ivory);white-space:pre-line}

#dreams{background:var(--bg2)}
.dreams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.d-card{background:linear-gradient(145deg,rgba(26,12,20,.7),rgba(20,8,16,.7));border:1px solid rgba(201,168,124,.15);border-radius:3px;padding:38px 30px;transition:all .5s cubic-bezier(.2,.8,.2,1)}
.d-card:hover{transform:translateY(-6px);border-color:rgba(201,168,124,.4);box-shadow:0 20px 45px rgba(201,168,124,.1)}
.d-icon{font-size:1.8rem;margin-bottom:18px;display:inline-block}
.d-title{font-family:var(--serif);font-size:1.3rem;color:var(--gold);margin-bottom:12px}
.d-desc{font-family:var(--serif);font-size:1rem;color:var(--muted);line-height:1.75}

#final{background:radial-gradient(ellipse at center,var(--bg2),var(--bg) 70%);text-align:center;min-height:90vh;display:flex;align-items:center;justify-content:center}
.final-inner{max-width:720px}
.final-heart{font-size:2.5rem;color:var(--rose-deep);animation:beat 1.6s ease-in-out infinite;margin-bottom:36px;display:inline-block}
.final-title{font-family:var(--script);font-size:clamp(3rem,9vw,6rem);line-height:1.1;color:var(--ivory);margin-bottom:36px}
.final-msg{font-family:var(--serif);font-style:italic;font-size:clamp(1.05rem,2.2vw,1.3rem);color:var(--rose);line-height:1.9;margin-bottom:48px;white-space:pre-line}
.final-sign{font-family:var(--script);font-size:clamp(1.8rem,5vw,2.6rem);color:var(--gold)}

@media (max-width:640px){
  section{padding:80px 18px}
  .tl{padding-left:32px}.tl-dot{left:-32px}
  .gallery-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>
<body>

<div id="loader"><div class="heart">♥</div><p class="msg" id="loader-msg">loading our story…</p><div class="bar"></div></div>

<button id="music" title="Toggle music">♪</button>

<section id="hero">
  <div class="hero-inner">
    <div class="hero-tag" id="hero-tag"></div>
    <h1 class="hero-title" id="hero-title"></h1>

      <span id="hero-btn-text"></span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M2 7l4 4 4-4" stroke="currentColor" stroke-width="1.2"/></svg>

</section>

<section id="letter"><div class="wrap fade-in">
  <div class="eyebrow" id="letter-eyebrow"></div>
  <h2 class="h-section" id="letter-heading"></h2>
  <div class="letter-card">
    <div class="letter-greet" id="letter-greet"></div>
    <div class="letter-body" id="letter-body"></div>
    <div class="letter-sign" id="letter-sign"></div>
  </div>
</div></section>

<section id="gallery"><div class="wrap fade-in">
  <div class="eyebrow" id="gallery-eyebrow"></div>
  <h2 class="h-section" id="gallery-heading"></h2>
  <div class="gallery-grid" id="gallery-grid"></div>
</div></section>
<div id="lb"><button id="lb-close">×</button><img id="lb-img" alt=""><div id="lb-cap"></div></div>

<section id="reasons"><div class="wrap fade-in">
  <div class="eyebrow" id="reasons-eyebrow"></div>
  <h2 class="h-section" id="reasons-heading"></h2>
  <div class="reasons-grid" id="reasons-grid"></div>
</div></section>

<section id="timeline"><div class="wrap fade-in">
  <div class="eyebrow" id="tl-eyebrow"></div>
  <h2 class="h-section" id="tl-heading"></h2>
  <div class="tl" id="tl-track"></div>
</div></section>

<section id="open-when"><div class="wrap fade-in">
  <div class="eyebrow" id="ow-eyebrow"></div>
  <h2 class="h-section" id="ow-heading"></h2>
  <div class="env-grid" id="env-grid"></div>
</div></section>
<div id="env-modal"><div class="env-paper">
  <button class="env-paper-close" onclick="closeEnv()">×</button>
  <div class="env-paper-when" id="env-paper-when"></div>
  <div class="env-paper-body" id="env-paper-body"></div>
</div></div>

<section id="dreams"><div class="wrap fade-in">
  <div class="eyebrow" id="dreams-eyebrow"></div>
  <h2 class="h-section" id="dreams-heading"></h2>
  <div class="dreams-grid" id="dreams-grid"></div>
</div></section>

<section id="final"><div class="final-inner fade-in">
  <span class="final-heart">♥</span>
  <h2 class="final-title" id="final-title"></h2>
  <p class="final-msg" id="final-msg"></p>
  <div class="final-sign" id="final-sign"></div>
</div></section>
